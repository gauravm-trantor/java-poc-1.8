# Pipeline for java-poc-1.8 (card SBJ17-2). Design: docs/cards/SBJ17-2.md, section Plan.
# Checks for branch protection on main: "CI / maven" and "CI / ui".
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The acceptance checks of card SBJ17-2 that read the pipeline file and the diff (AC1, AC2, AC3, AC5).
  # They hold for this card only (JDK 8, no existing file changed), so they run only on its pull request
  # and are skipped on every other one. Do not make "CI / acceptance" a required check.
  acceptance:
    if: github.head_ref == 'card/SBJ17-2-pipeline'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the checks' one dependency
        run: python -m pip install --quiet pyyaml==6.0.2
      - name: AC1 runs on each pull request to main and push to main
        if: always()
        run: python scripts/ci/AC1-triggers.py
      - name: AC2 mvn -B clean test on JDK 8, fails on any failed test
        if: always()
        run: python scripts/ci/AC2-maven-on-jdk8.py
      - name: AC3 UI tests in headless Chrome on Node 20.19+, fails on any failure
        if: always()
        run: python scripts/ci/AC3-ui-headless-chrome.py
      - name: AC5 no existing source, pom or test changes
        if: always()
        run: python scripts/ci/AC5-no-existing-file-changed.py origin/main

  # The acceptance checks of card SBJ17-9 (AC1 to AC3; AC4 is the maven and ui jobs). AC3 holds the pins to
  # what each label pointed to on the day of pinning, so it runs only on this card's pull request.
  # Do not make "CI / acceptance-sbj17-9" a required check.
  acceptance-sbj17-9:
    if: github.head_ref == 'card/SBJ17-9-pin-pipeline'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: AC1 every uses names a full commit with its release
        if: always()
        run: python3 scripts/ci/SBJ17-9/AC1-actions-pinned.py
      - name: AC2 the HBase image is named by its digest, tag kept
        if: always()
        run: python3 scripts/ci/SBJ17-9/AC2-hbase-image-digest.py
      - name: AC3 each pin is what its label pointed to on the day of pinning
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/SBJ17-9/AC3-pins-match-labels.py

  # The acceptance checks of card SBJ17-13 (AC1 to AC3, and AC4's first half; its second half is the maven
  # and ui jobs and the other workflows). AC4 holds for this card's diff only, so the job runs only on its
  # pull request. Do not make "CI / acceptance-sbj17-13" a required check.
  acceptance-sbj17-13:
    if: github.head_ref == 'card/SBJ17-13-maven-cache'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the checks' one dependency
        run: python -m pip install --quiet pyyaml==6.0.2
      - name: AC1 each Maven job restores the newest earlier cache when the poms changed
        if: always()
        run: python scripts/ci/SBJ17-13/AC1-restore-older-cache.py
      - name: AC2 each Maven job saves its cache even when tests fail
        if: always()
        run: python scripts/ci/SBJ17-13/AC2-save-on-failure.py
      - name: AC3 Maven retries a refused download at least 5 times over at least a minute
        if: always()
        run: python scripts/ci/SBJ17-13/AC3-retry-refused-download.py
      - name: AC4 no pom, source or test changes
        if: always()
        run: python scripts/ci/SBJ17-13/AC4-no-pom-source-test-change.py origin/main

  # Every Maven module on JDK 8 (AC2), with the HBase tests checked as run (AC4).
  maven:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      # HBase advertises the name host.docker.internal (docker/local/hbase-server-site.xml). Docker Desktop
      # resolves it on Windows; on this Linux runner it must point at the published ports on localhost.
      - name: Resolve host.docker.internal to localhost
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - name: Start HBase from the repository's local stack
        run: docker compose -f docker/local/docker-compose.yml up -d hbase
      - name: Wait for HBase
        run: |
          for i in $(seq 1 60); do
            if nc -z localhost 2181 && nc -z localhost 16000 && nc -z localhost 16020 \
               && echo "list" | docker exec -i sales-hbase hbase shell -n > /dev/null 2>&1; then
              echo "HBase is ready after $((i * 5)) s"
              exit 0
            fi
            sleep 5
          done
          echo "HBase did not start within 5 minutes"
          docker logs sales-hbase
          exit 1
      - name: Maven tests
        run: mvn -B clean test
      - name: AC4 the 2 HBase tests run, not skip
        if: always()
        run: python3 scripts/ci/AC4-hbase-tests-ran.py
      - name: HBase log
        if: failure()
        run: docker logs sales-hbase 2>&1 | tail -200
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  # The UI tests, once, headless in Chrome (AC3). Node 22: Node 20 is past its end of life.
  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: UI tests
        run: npx ng test --watch=false --browsers=ChromeHeadless
