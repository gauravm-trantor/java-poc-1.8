# Pipeline for java-poc-1.8 (card SBJ17-2). Design: docs/cards/SBJ17-2.md, section Plan.
# Checks for branch protection on main: "CI / maven" and "CI / ui".
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The acceptance checks of card SBJ17-2 that read the pipeline file and the diff (AC1, AC2, AC3, AC5).
  # They hold for this card only (JDK 8, no existing file changed), so they run only on its pull request
  # and are skipped on every other one. Do not make "CI / acceptance" a required check.
  acceptance:
    if: github.head_ref == 'card/SBJ17-2-pipeline'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the checks' one dependency
        run: python -m pip install --quiet pyyaml==6.0.2
      - name: AC1 runs on each pull request to main and push to main
        if: always()
        run: python scripts/ci/AC1-triggers.py
      - name: AC2 mvn -B clean test on JDK 8, fails on any failed test
        if: always()
        run: python scripts/ci/AC2-maven-on-jdk8.py
      - name: AC3 UI tests in headless Chrome on Node 20.19+, fails on any failure
        if: always()
        run: python scripts/ci/AC3-ui-headless-chrome.py
      - name: AC5 no existing source, pom or test changes
        if: always()
        run: python scripts/ci/AC5-no-existing-file-changed.py origin/main

  # The acceptance checks of card SBJ17-9 (AC1 to AC3; AC4 is the maven and ui jobs). AC3 holds the pins to
  # what each label pointed to on the day of pinning, so it runs only on this card's pull request.
  # Do not make "CI / acceptance-sbj17-9" a required check.
  acceptance-sbj17-9:
    if: github.head_ref == 'card/SBJ17-9-pin-pipeline'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: AC1 every uses names a full commit with its release
        if: always()
        run: python3 scripts/ci/SBJ17-9/AC1-actions-pinned.py
      - name: AC2 the HBase image is named by its digest, tag kept
        if: always()
        run: python3 scripts/ci/SBJ17-9/AC2-hbase-image-digest.py
      - name: AC3 each pin is what its label pointed to on the day of pinning
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/SBJ17-9/AC3-pins-match-labels.py

  # The acceptance checks of card SBJ17-14 (the EMR 7.14.0 data stack on Java 8). AC2 runs in the maven job.
  # AC4 and AC5 build main and this branch side by side in containers. They compare against main, so they run
  # only on this card's pull request. Do not make "CI / acceptance-sbj17-14" a required check.
  acceptance-sbj17-14:
    if: github.head_ref == 'card/SBJ17-14-data-stack-emr7'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SBS_OUT: ${{ github.workspace }}/target/sbj17-14-sbs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: AC1 every module builds on JDK 8 against the EMR 7.14.0 versions
        if: always()
        run: python3 scripts/ci/SBJ17-14/AC1-versions.py
      - name: AC1 the existing tests are unchanged
        if: always()
        run: python3 scripts/ci/SBJ17-14/AC1-existing-tests-unchanged.py origin/main
      - name: AC3 the fat jar bundles HBase 2.6.4's client, not Spark, Hadoop or Scala
        if: always()
        run: python3 scripts/ci/SBJ17-14/AC3-fat-jar.py
      - name: AC4 byte-identical report from main and this branch, both on Java 8 in Linux containers
        if: always()
        run: bash scripts/ci/SBJ17-14/AC4-report-side-by-side.sh
      - name: AC5 the HBase table layout is unchanged
        if: always()
        run: sh scripts/ci/SBJ17-14/AC5-table-layout.sh
      - name: Keep the side-by-side output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbj17-14-side-by-side
          path: |
            target/sbj17-14-sbs/summary.txt
            target/sbj17-14-sbs/*/reports/
            target/sbj17-14-sbs/*/versions.txt
            target/sbj17-14-sbs/*/layout.txt
            target/sbj17-14-sbs/*/*.log
            target/sbj17-14-sbs/*/error.txt
          if-no-files-found: ignore

  # Every Maven module on JDK 8 (AC2), with the HBase tests checked as run (AC4).
  maven:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      # HBase advertises the name host.docker.internal (docker/local/hbase-server-site.xml). Docker Desktop
      # resolves it on Windows; on this Linux runner it must point at the published ports on localhost.
      - name: Resolve host.docker.internal to localhost
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
      - name: Start HBase from the repository's local stack
        run: docker compose -f docker/local/docker-compose.yml up -d --build hbase
      - name: Wait for HBase
        run: |
          for i in $(seq 1 60); do
            if nc -z localhost 2181 && nc -z localhost 16000 && nc -z localhost 16020 \
               && echo "list" | docker exec -i sales-hbase hbase shell -n > /dev/null 2>&1; then
              echo "HBase is ready after $((i * 5)) s"
              exit 0
            fi
            sleep 5
          done
          echo "HBase did not start within 5 minutes"
          docker logs sales-hbase
          exit 1
      - name: Maven tests
        run: mvn -B clean test
      - name: AC4 the 2 HBase tests run, not skip
        if: always()
        run: python3 scripts/ci/AC4-hbase-tests-ran.py
      - name: SBJ17-14 AC2 the HBase tests ran against HBase 2.6.4 from the repository's image
        if: always()
        run: sh scripts/ci/SBJ17-14/AC2-hbase-version.sh sales-hbase
      - name: HBase log
        if: failure()
        run: docker logs sales-hbase 2>&1 | tail -200
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  # The UI tests, once, headless in Chrome (AC3). Node 22: Node 20 is past its end of life.
  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: UI tests
        run: npx ng test --watch=false --browsers=ChromeHeadless
