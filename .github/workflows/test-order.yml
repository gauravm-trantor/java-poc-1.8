# Runs the workflow-app tests in several orders, each from an empty temp folder (card SBJ17-7).
# Design: docs/cards/SBJ17-7.md, section Plan. Scripts: scripts/ci/test-order/.
name: Test order

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Card SBJ17-13: Maven waits longer and retries more before it gives up on a refused download (HTTP 429):
# 6 retries, 10 s x attempt apart (10+20+...+60 = 210 s). Maven reads MAVEN_ARGS on every mvn call. The first
# pair is Maven Resolver 1.x's name (Maven 3.9), the second Resolver 2.x's (Maven 3.10 and later).
env:
  MAVEN_ARGS: >-
    -Daether.connector.http.retryHandler.count=6 -Daether.connector.http.retryHandler.interval=10000
    -Daether.transport.http.retryHandler.count=6 -Daether.transport.http.retryHandler.interval=10000

concurrency:
  group: test-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  any-order:
    name: AC1 tests pass in ${{ matrix.order }} order
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        order: [alphabetical, reversealphabetical, random]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '8'
      # Card SBJ17-13: restore the Maven repository, falling back to the newest older cache when the poms
      # changed (setup-java's own cache has no fallback). The job's last two steps save it.
      - name: Restore the Maven repository
        id: maven-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml') }}-partial-
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-
            setup-java-${{ runner.os }}-x64-maven-
      - name: AC1 tests pass in ${{ matrix.order }} order
        run: sh scripts/ci/test-order/AC1-any-order.sh ${{ matrix.order }}
      # Card SBJ17-13: save the Maven repository, on a red run too. A red run saves under a -partial- key,
      # so the full key stays free for the next green run. Keep these two steps last.
      - name: Save the Maven repository
        if: success() && steps.maven-cache.outcome == 'success' && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}
      - name: Save the Maven repository, run failed
        if: failure() && steps.maven-cache.outcome == 'success' && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

  reports:
    name: AC2 and AC3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '8'
      # Card SBJ17-13: restore the Maven repository, falling back to the newest older cache when the poms
      # changed (setup-java's own cache has no fallback). The job's last two steps save it.
      - name: Restore the Maven repository
        id: maven-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml') }}-partial-
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-
            setup-java-${{ runner.os }}-x64-maven-
      - name: AC2 WebConfigTest before SalesBatchProcessTest passes
        if: always()
        run: sh scripts/ci/test-order/AC2-webconfig-first.sh
      - name: AC3 no report written outside target
        if: always()
        run: sh scripts/ci/test-order/AC3-reports-inside-target.sh
      # Card SBJ17-13: save the Maven repository, on a red run too. A red run saves under a -partial- key,
      # so the full key stays free for the next green run. Keep these two steps last.
      - name: Save the Maven repository
        if: success() && steps.maven-cache.outcome == 'success' && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}
      - name: Save the Maven repository, run failed
        if: failure() && steps.maven-cache.outcome == 'success' && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

  unchanged:
    name: AC4 existing tests unchanged, no forced order
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: AC4 existing tests unchanged, pipeline forces no order
        run: sh scripts/ci/test-order/AC4-tests-unchanged-no-forced-order.sh origin/${{ github.base_ref || 'main' }}
